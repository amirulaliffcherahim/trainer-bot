    topics: ["taper"]
    forbidden: ["more mileage"]
    citation: true
  - id: runner-006
    persona: runner
    prompt: "Should I run on rest day Wednesday?"
    topics: ["rest", "no recovery run"]
    forbidden: ["yes"]
    citation: true
  - id: runner-007
    persona: runner
    prompt: "How fast should the long trial run be next week?"
    topics: ["slow", "trial"]
    forbidden: ["race pace"]
    citation: true
  - id: runner-008
    persona: runner
    prompt: "My long run is Saturday — legs feel heavy today."
    topics: ["easy", "recover"]
    forbidden: ["push through"]
    citation: false
  - id: runner-009
    persona: runner
    prompt: "What's the plan for race week?"
    topics: ["shakeout"]
    forbidden: ["long run"]
    citation: true

