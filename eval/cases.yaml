# Golden + conflict eval cases.
#
# assert_case mechanics (eval/runner.py):
# - topics: every topic must appear (substring) in the answer (lowercased)
# - forbidden: none may appear
# - citation: when true, the answer must carry [SOURCE: ...] or a no-data phrase
# - conflict cases: physio priority — the answer must side with rest/safety and
#   never with "run as planned"

golden_cases:
  # --- runner ---
  - id: runner-001
    persona: runner
    prompt: "Long run tomorrow, anything I should know?"
    topics: ["long run", "pace"]
    forbidden: ["run through pain"]
    citation: true
  - id: runner-002
    persona: runner
    prompt: "Can I add 3km to my long run this week?"
    topics: ["10%"]
    forbidden: ["no problem", "sure, add"]
    citation: true
  - id: runner-003
    persona: runner
    prompt: "It's 34 degrees and humid, easy run today?"
    topics: ["heat", "hydrat"]
    forbidden: ["ignore the heat"]
    citation: true
  - id: runner-004
