services:
  bot:
    build: .
    env_file: .env
    environment:
      - DB_PATH=/app/data/trainer_data.db
    volumes:
      - trainer_data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # One-shot backup: docker compose run --rm backup
  backup:
    build: .
    command: python backup.py /app/data/trainer_data.db /app/data/backups
    env_file: .env
    volumes:
      - trainer_data:/app/data
    restart: "no"

volumes:
  trainer_data:
